name: Sync Wyndham availability to Airbnb feeds

on:
  schedule:
    - cron: "23 1,7,13,19 * * *"   # 4x a day (UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wyndham-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      # Reuse the session saved by the previous run (keeps cookies fresh).
      - name: Restore saved Wyndham session
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: wyndham-state-${{ github.run_id }}
          restore-keys: wyndham-state-

      # First run, or cache evicted: fall back to the session you uploaded.
      - name: Seed session from secret
        if: hashFiles('state.json') == ''
        env:
          WYNDHAM_STATE: ${{ secrets.WYNDHAM_STATE }}
        run: |
          if [ -z "$WYNDHAM_STATE" ]; then echo "WYNDHAM_STATE secret missing"; exit 1; fi
          echo "$WYNDHAM_STATE" | base64 -d > state.json

      - name: Fetch availability and build feeds
        env:
          WYNDHAM_USERNAME: ${{ secrets.WYNDHAM_USERNAME }}
          WYNDHAM_PASSWORD: ${{ secrets.WYNDHAM_PASSWORD }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: python sync.py --out public

      - name: Save refreshed session
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: wyndham-state-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Only reached when sync succeeded, so a failed run leaves the last good feeds live.
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
